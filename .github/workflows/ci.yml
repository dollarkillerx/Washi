name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS: the OCR tests use Apple Vision, and the app tests render with Skia headless
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WASHI_LANG: en
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: UI strings are generated from strings.py
        run: |
          python3 src/Washi.Core/Localization/strings.py
          git diff --exit-code -- src/Washi.Core/Localization

      - name: Build
        run: dotnet build Washi.slnx -c Release

      - name: Core, tools and CLI tests
        run: dotnet test --project tests/Washi.Masume.Tests -c Release --no-build

      - name: Desktop app tests
        run: dotnet test --project tests/Washi.App.Tests -c Release --no-build
